<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence Dashboard</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #eef2f6;
  --ink: #17202a;
  --muted: #647282;
  --line: #d9e0e8;
  --blue: #2663eb;
  --green: #14804a;
  --amber: #a15c07;
  --red: #b42318;
  --purple: #6e3aad;
  --teal: #0e7490;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
button, input, select { font: inherit; }
.shell { max-width: 1480px; margin: 0 auto; padding: 20px; }
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
.meta { color: var(--muted); margin-top: 4px; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.btn {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  color: var(--ink);
}
.btn:hover { border-color: #aeb9c5; background: #fdfefe; }
.metrics { display: grid; grid-template-columns: repeat(7, minmax(112px, 1fr)); gap: 10px; margin-bottom: 14px; }
.metric { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.metric-value { font-size: 24px; font-weight: 750; }
.metric-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.filters { display: grid; grid-template-columns: minmax(220px, 1fr) 160px 160px 160px auto; gap: 10px; margin-bottom: 14px; }
.field, .select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 10px;
  background: var(--panel);
  color: var(--ink);
}
.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 6px;
  padding: 0 10px;
  min-height: 38px;
  white-space: nowrap;
}
.layout { display: grid; grid-template-columns: 1fr 330px; gap: 14px; align-items: start; }
.table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th {
  position: sticky;
  top: 0;
  background: #e9eef4;
  color: #344150;
  padding: 10px;
  text-align: left;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
  border-bottom: 1px solid var(--line);
  z-index: 1;
}
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:hover td { background: #fbfcfd; }
.company { font-weight: 700; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.stalled { background: #fee4e2; color: var(--red); }
.due { background: #fff1cf; color: var(--amber); }
.active { background: #dcfae6; color: var(--green); }
.complete { background: #dbeafe; color: #1d4ed8; }
.needs-data, .pending { background: #eee7fb; color: var(--purple); }
.progress { font-weight: 700; color: var(--teal); }
.small { color: var(--muted); font-size: 12px; }
.next { font-weight: 700; }
.late { color: var(--red); }
.soon { color: var(--amber); }
.ok { color: var(--green); }
.touch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; min-width: 122px; }
.touch-box { height: 18px; border-radius: 3px; background: #e5eaf0; color: #485465; font-size: 11px; text-align: center; line-height: 18px; }
.touch-box.done { background: #c7f0d7; color: #0f6838; }
.side { display: grid; gap: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.panel h2 { margin: 0 0 10px; font-size: 15px; }
.list { display: grid; gap: 8px; }
.item { border-top: 1px solid var(--line); padding-top: 8px; }
.item:first-child { border-top: 0; padding-top: 0; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
@media (max-width: 1100px) {
  .metrics { grid-template-columns: repeat(3, 1fr); }
  .filters { grid-template-columns: 1fr 1fr; }
  .layout { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .shell { padding: 12px; }
  .topbar { display: block; }
  .actions { justify-content: flex-start; margin-top: 10px; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .filters { grid-template-columns: 1fr; }
  table { min-width: 920px; }
  .table-wrap { overflow-x: auto; }
}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div>
      <h1>Cadence Dashboard</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="actions">
      <button class="btn" id="refreshBtn" title="Reload data">Refresh</button>
      <button class="btn" id="exportBtn" title="Download visible rows">Export CSV</button>
    </div>
  </div>
  <section class="metrics" id="metrics"></section>
  <section class="filters">
    <input class="field" id="search" placeholder="Search company, folder, status">
    <select class="select" id="statusFilter">
      <option value="all">All statuses</option>
      <option value="stalled">Stalled</option>
      <option value="due">Due now</option>
      <option value="active">Active</option>
      <option value="complete">Complete</option>
      <option value="needs-data">Needs data</option>
    </select>
    <select class="select" id="touchFilter">
      <option value="all">All touches</option>
      <option value="0">Not started</option>
      <option value="1">Touch 1</option>
      <option value="2">Touch 2</option>
      <option value="3">Touch 3</option>
      <option value="4">Touch 4</option>
      <option value="5">Touch 5</option>
    </select>
    <select class="select" id="sortBy">
      <option value="risk">Sort by risk</option>
      <option value="due">Sort by due date</option>
      <option value="company">Sort by company</option>
      <option value="latest">Sort by last touch</option>
    </select>
    <label class="toggle"><input type="checkbox" id="onlyStalled"> Needs attention</label>
  </section>
  <section class="layout">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 24%">Campaign</th>
            <th style="width: 11%">Status</th>
            <th style="width: 11%">Stage</th>
            <th style="width: 14%">Next Send</th>
            <th style="width: 12%">Contacts</th>
            <th style="width: 14%">Touch Health</th>
            <th style="width: 14%">Last Activity</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No campaigns match those filters.</div>
    </div>
    <aside class="side">
      <div class="panel">
        <h2>Needs Attention</h2>
        <div class="list" id="attention"></div>
      </div>
      <div class="panel">
        <h2>Upcoming Sends</h2>
        <div class="list" id="upcoming"></div>
      </div>
    </aside>
  </section>
</main>

const state = { rows: [], visible: [] };

function statusClass(status) {
  return ["stalled", "due", "active", "complete", "needs-data", "pending"].includes(status) ? status : "pending";
}

function nextClass(row) {
  if (row.status === "stalled") return "late";
  if (row.status === "due") return "soon";
  if (row.status === "complete") return "ok";
  return "";
}

function dueText(row) {
  if (!row.nextTouch) return "Done";
  const label = row.nextDueLabel || "Unscheduled";
  if (row.dueDelta == null) return label;
  if (row.dueDelta < 0) return label + " (" + Math.abs(row.dueDelta) + "d late)";
  if (row.dueDelta === 0) return label + " (today)";
  return label + " (in " + row.dueDelta + "d)";
}

function renderMetrics(data) {
  const metrics = [
    ["Total", data.stats.total],
    ["Stalled", data.stats.stalled],
    ["Due Today", data.stats.due],
    ["Active", data.stats.active],
    ["Complete", data.stats.complete],
    ["Queued Sends", data.stats.queued],
    ["Bounced", data.stats.bounced],
  ];
  document.getElementById("metrics").innerHTML = metrics.map(([label, value]) => (
    '<div class="metric"><div class="metric-value">' + value + '</div><div class="metric-label">' + label + '</div></div>'
  )).join("");
}

function touchGrid(row) {
  return '<div class="touch-grid">' + row.touches.map((count, index) => {
    const done = count > 0 ? " done" : "";
    return '<div class="touch-box' + done + '" title="Touch ' + (index + 1) + ': ' + count + ' sent">' + count + '</div>';
  }).join("") + '</div>';
}

function rowHtml(row) {
  const contactMeta = row.contacts + " total";
  const health = [row.bounced ? row.bounced + " bounced" : "", row.replied ? row.replied + " replied" : "", row.restricted ? row.restricted + " done/skipped" : ""].filter(Boolean).join(" · ");
  return '<tr>' +
    '<td><div class="company">' + escapeHtml(row.company) + '</div><div class="sub">' + escapeHtml(row.folder) + '</div></td>' +
    '<td><span class="pill ' + statusClass(row.status) + '">' + escapeHtml(row.status) + '</span></td>' +
    '<td><div class="progress">' + escapeHtml(row.progress) + '</div><div class="small">coverage ' + escapeHtml(row.coverage) + '</div></td>' +
    '<td><div class="next ' + nextClass(row) + '">' + escapeHtml(row.nextLabel) + '</div><div class="small">' + escapeHtml(dueText(row)) + '</div></td>' +
    '<td><div>' + escapeHtml(contactMeta) + '</div><div class="small">' + escapeHtml(health || row.activeContacts + " active") + '</div></td>' +
    '<td>' + touchGrid(row) + '</td>' +
    '<td><div>' + escapeHtml(row.latestDateLabel || "No sent touch") + '</div><div class="small">' + (row.ageDays == null ? "" : escapeHtml(row.ageDays + "d ago")) + '</div></td>' +
  '</tr>';
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getFilteredRows() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;
  const touch = document.getElementById("touchFilter").value;
  const onlyStalled = document.getElementById("onlyStalled").checked;
  let rows = state.rows.filter((row) => {
    const haystack = [row.company, row.folder, row.status, row.registryStatus].join(" ").toLowerCase();
    if (q && !haystack.includes(q)) return false;
    if (status !== "all" && row.status !== status) return false;
    if (touch !== "all" && String(row.currentTouch) !== touch) return false;
    if (onlyStalled && !["stalled", "due", "needs-data"].includes(row.status)) return false;
    return true;
  });
  const sortBy = document.getElementById("sortBy").value;
  rows = [...rows].sort((a, b) => {
    if (sortBy === "company") return a.company.localeCompare(b.company);
    if (sortBy === "latest") return String(b.latestDate).localeCompare(String(a.latestDate));
    if (sortBy === "due") return String(a.nextDue || "9999-99-99").localeCompare(String(b.nextDue || "9999-99-99"));
    const order = { stalled: 0, due: 1, active: 2, "needs-data": 3, pending: 4, complete: 5 };
    return (order[a.status] ?? 4) - (order[b.status] ?? 4) || (a.dueDelta ?? 9999) - (b.dueDelta ?? 9999) || a.company.localeCompare(b.company);
  });
  return rows;
}

function renderSidebars(rows) {
  const attention = state.rows.filter((row) => ["stalled", "due", "needs-data"].includes(row.status)).slice(0, 12);
  document.getElementById("attention").innerHTML = attention.length ? attention.map((row) => (
    '<div class="item"><div class="company">' + escapeHtml(row.company) + '</div><div class="small">' + escapeHtml(row.nextLabel + " · " + dueText(row)) + '</div></div>'
  )).join("") : '<div class="small">Nothing urgent.</div>';
  const upcoming = state.rows
    .filter((row) => row.nextTouch && row.nextDue && row.dueDelta >= 0)
    .sort((a, b) => a.dueDelta - b.dueDelta)
    .slice(0, 12);
  document.getElementById("upcoming").innerHTML = upcoming.length ? upcoming.map((row) => (
    '<div class="item"><div class="company">' + escapeHtml(row.company) + '</div><div class="small">' + escapeHtml(row.nextLabel + " · " + dueText(row)) + '</div></div>'
  )).join("") : '<div class="small">No queued upcoming sends.</div>';
}

function render() {
  state.visible = getFilteredRows();
  document.getElementById("rows").innerHTML = state.visible.map(rowHtml).join("");
  document.getElementById("empty").hidden = state.visible.length !== 0;
  renderSidebars(state.visible);
}

function hydrate(data) {
  state.rows = data.rows || [];
  document.getElementById("meta").textContent = "Generated " + data.generatedLabel + " · " + data.stats.total + " campaigns · auto-refreshes every 60s when served locally";
  renderMetrics(data);
  render();
}

async function refreshData() {
  try {
    const res = await fetch("/data.json", { cache: "no-store" });
    if (res.ok) hydrate(await res.json());
  } catch {
    hydrate(window.__CADENCE_DATA__);
  }
}

function exportCsv() {
  const headers = ["Company", "Folder", "Status", "Progress", "Next Touch", "Next Due", "Contacts", "Bounced", "Replied", "Last Activity"];
  const lines = [headers.join(",")].concat(state.visible.map((row) => [
    row.company, row.folder, row.status, row.progress, row.nextLabel, row.nextDue || "", row.contacts, row.bounced, row.replied, row.latestDate || ""
  ].map((value) => '"' + String(value ?? "").replace(/"/g, '""') + '"').join(",")));
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "cadence-dashboard.csv";
  a.click();
  URL.revokeObjectURL(url);
}

["search", "statusFilter", "touchFilter", "sortBy", "onlyStalled"].forEach((id) => {
  document.getElementById(id).addEventListener("input", render);
});
document.getElementById("refreshBtn").addEventListener("click", refreshData);
document.getElementById("exportBtn").addEventListener("click", exportCsv);
hydrate(window.__CADENCE_DATA__);
setInterval(refreshData, 60000);
</script>
</body>
</html>
